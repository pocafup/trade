[tool.poetry]
name = "quant"
version = "0.1.0"
description = "Portfolio risk service for trade tracker"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
yfinance = ">=0.2.51"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
alpaca-py = ">=0.30.0"
python-dotenv = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
